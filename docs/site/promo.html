<style>
  :root { --bg: #070b11; --line: #24323f; --sub: #afc3d2; --accent: #1f748a;

  * { box-sizing: border-box; }

  button { font: 14px var(--font); color: #fff; background: #1b2732; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; color: var(--sub); font-size: 13px; min-width: 88px; text-align: right; }

</style>

    } }
  ];
  var TOTAL = SCENES.reduce(function (s, x) { return s + x.dur; }, 0);

  // Deterministic QR-like pattern (decorative).
  var QR_N = 25, qrBits = [];
  (function () { var seed = 7; for (var i = 0; i < QR_N * QR_N; i++) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; qrBits.push(seed % 3 === 0); } })();
  function qr(x, y, size) {
    var c = size / QR_N; ctx.fillStyle = '#000';
    for (var r = 0; r < QR_N; r++) for (var q = 0; q < QR_N; q++) {
      var finder = (r < 7 && q < 7) || (r < 7 && q >= QR_N - 7) || (r >= QR_N - 7 && q < 7);
      if (finder) continue;
      if (qrBits[r * QR_N + q]) ctx.fillRect(x + q * c, y + r * c, c + .3, c + .3);
    }
    [[0, 0], [QR_N - 7, 0], [0, QR_N - 7]].forEach(function (p) {
      ctx.fillStyle = '#000'; ctx.fillRect(x + p[0] * c, y + p[1] * c, 7 * c, 7 * c);
      ctx.fillStyle = '#fff'; ctx.fillRect(x + (p[0] + 1) * c, y + (p[1] + 1) * c, 5 * c, 5 * c);
      ctx.fillStyle = '#000'; ctx.fillRect(x + (p[0] + 2) * c, y + (p[1] + 2) * c, 3 * c, 3 * c);
    });
  }

  function render(time) {
    background(time);
    var acc = 0;
    for (var i = 0; i < SCENES.length; i++) {
      var sc = SCENES[i];
      if (time < acc + sc.dur || i === SCENES.length - 1) {
        var local = Math.min(time - acc, sc.dur);
        ctx.save(); ctx.globalAlpha = 1;
        // Cross-fade the first 0.35 s of each scene from black for clean cuts.
        sc.draw(local, sc.dur);
        ctx.restore();
        var fade = 1 - seg(local, 0, .35);
        if (i > 0 && fade > 0) { ctx.fillStyle = 'rgba(7,11,17,' + fade + ')'; ctx.fillRect(0, 0, W, H); }
        break;
      }
      acc += sc.dur;
    }
  }

  // ---------- playback ----------
  var playing = true, time = 0, last = performance.now(), recording = false;
  var playBtn = document.getElementById('play'), seek = document.getElementById('seek'), timeEl = document.getElementById('time');
  function frame(now) {
    var dt = Math.min(.1, (now - last) / 1000); last = now;
    if (playing) {
      time += dt;
      if (time >= TOTAL) {
        if (recording) { stopRecording(); time = TOTAL; playing = false; }
        else { time = 0; }
      }
    }
    render(time);
    seek.value = Math.round(time / TOTAL * 1000);
    timeEl.textContent = time.toFixed(1) + ' / ' + TOTAL.toFixed(1) + ' s';
    requestAnimationFrame(frame);
  }
  playBtn.addEventListener('click', function () { playing = !playing; playBtn.textContent = playing ? '暂停' : '播放'; });
  document.getElementById('restart').addEventListener('click', function () { time = 0; playing = true; playBtn.textContent = '暂停'; });
  seek.addEventListener('input', function () { if (!recording) time = seek.value / 1000 * TOTAL; });

  // ---------- export ----------
  var recorder = null, chunks = [];
  var exportBtn = document.getElementById('export'), hint = document.getElementById('hint');
  hint.textContent = '导出会从头完整录制一遍（约 ' + Math.round(TOTAL) + ' 秒），完成后自动下载 1920×1080 的 WebM 视频。录制期间请保持此页面在前台。';
  function stopRecording() { if (recorder && recorder.state !== 'inactive') recorder.stop(); }
  exportBtn.addEventListener('click', function () {
    if (!window.MediaRecorder || !canvas.captureStream) { hint.textContent = '当前浏览器不支持录制，请使用最新版 Chrome 或 Edge。'; return; }
    var types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    var type = types.filter(function (t) { return MediaRecorder.isTypeSupported(t); })[0];
    chunks = [];
    recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: type, videoBitsPerSecond: 12000000 });
    recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = function () {
      recording = false; exportBtn.disabled = false; playBtn.disabled = false;
      var blob = new Blob(chunks, { type: 'video/webm' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '腕上智家宣传片.webm';
      document.body.appendChild(a); a.click(); a.remove();
      hint.textContent = '已导出「腕上智家宣传片.webm」。需要 MP4 时，可以用剪映、HandBrake 等工具转换。';
    };
    time = 0; playing = true; recording = true; playBtn.textContent = '暂停';
    exportBtn.disabled = true; playBtn.disabled = true;
    hint.textContent = '正在录制，请保持页面在前台……';
    recorder.start(250);
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
